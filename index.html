<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Le journal</title>
  <link rel="stylesheet" href="styles.css">
  <script src="config.js"></script>
  <script src="password-utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>
  <script src="auth.js" defer></script>
</head>
<body data-page="articles">
  <header class="site-header">
    <a class="wordmark" href="index.html" aria-label="Accueil"><img class="brand-mark" src="atelier-mark.svg" alt=""><span class="wordmark-name">atelier<span>.</span></span></a>
    <nav class="site-nav" aria-label="Navigation principale">
      <a class="nav-current" href="index.html">Le journal</a>
    </nav>
    <div class="account-nav">
      <span class="account-label" id="account-label" hidden></span>
      <a class="nav-login" id="login-link" href="login.html">Se connecter</a>
      <a class="nav-write" id="write-link" href="write.html" hidden>Écrire un article <span aria-hidden="true">↗</span></a>
      <a class="nav-admin" id="admin-link" href="admin.html" hidden>Administration</a>
      <button class="nav-logout" id="logout-button" type="button" hidden>Déconnexion</button>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Activer le thème nuit" title="Activer le thème nuit"><span class="theme-icon" aria-hidden="true">☾</span></button>
    </div>
  </header>

  <main class="journal-main">
    <section class="journal-heading" aria-labelledby="journal-title">
      <div>
        <p class="eyebrow">NOTES ET IDÉES</p>
        <h1 id="journal-title">Le journal<span>.</span></h1>
        <p class="journal-intro">Des textes récents, à lire à votre rythme.</p>
      </div>
      <p class="article-count" id="article-count" aria-live="polite">--</p>
    </section>

    <p class="journal-status" id="article-status" role="status" aria-live="polite">Chargement des articles…</p>
    <section class="article-list" id="article-list" aria-label="Articles"></section>
  </main>
</body>
</html>
